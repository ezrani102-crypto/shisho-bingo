<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SHISHO BINGO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #080510; --gold: #FFD700; --purple: #3a1c71; --red: #e74c3c; --green: #2ecc71; --glass: rgba(25, 15, 45, 0.8); }
    body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 15px; background: var(--glass); display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
    .logo { color: var(--gold); font-weight: bold; }
    .content { flex: 1; overflow-y: auto; padding: 15px; }
    .nav { display: flex; background: var(--glass); padding: 10px; border-top: 1px solid #333; }
    .nav button { flex: 1; background: none; border: none; color: #aaa; padding: 10px; font-size: 16px; cursor: pointer; }
    .nav button.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
    .hidden { display: none !important; }
    .card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    .btn { background: var(--gold); color: #000; border: none; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px;}
    
    /* Cartelas Grid */
    .cartela-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
    .cartela { padding: 15px 0; text-align: center; border-radius: 5px; background: var(--purple); font-weight: bold; cursor: pointer;}
    .cartela.taken { background: var(--red); opacity: 0.5; }
    .cartela.mine { background: var(--gold); color: #000; box-shadow: 0 0 10px var(--gold); }
    
    /* Bingo Board */
    .bingo-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 10px; background: #222; padding: 2px; }
    .cell { background: #111; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: bold;}
    .cell.called { background: var(--gold); color: #000; }
    .cell.free { background: var(--purple); color: #fff; }
    .game-status { text-align: center; font-size: 24px; color: var(--gold); margin: 10px 0; font-weight: bold;}
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">SHISHO BINGO</div>
    <div id="wallet-status">
      <span id="w-loading">Loading...</span>
      <span id="w-error" class="hidden" style="color:var(--red)">Error <button onclick="fetchMe()" style="background:none;border:1px solid var(--red);color:var(--red)">Retry</button></span>
      <strong id="w-balance" class="hidden"><span id="bal-amt"></span> BIRR</strong>
    </div>
  </div>

  <div class="content">
    <!-- PLAY TAB -->
    <div id="tab-play">
      <div id="room-list"></div>
      <div id="room-detail" class="hidden">
        <h2 id="r-title"></h2>
        <p>Pot: <span id="r-pot"></span> BIRR | Status: <strong id="r-status" style="color:var(--gold)"></strong></p>
        
        <!-- Game UI -->
        <div id="game-ui" class="hidden">
          <div class="game-status" id="g-current-num">Waiting...</div>
          <p>Recent: <span id="g-recent"></span></p>
          <div id="bingo-boards"></div>
          <button class="btn" onclick="claimBingo()" style="background:var(--green); color:white;">🎉 BINGO!</button>
        </div>

        <!-- Cartela Selection UI -->
        <div id="cartela-ui">
          <p>Select Cartela (10 BIRR) - Max 2</p>
          <div class="cartela-grid" id="c-grid"></div>
        </div>
        <button class="btn" onclick="backToRooms()" style="background:#444; color:white;">Leave Room</button>
      </div>
    </div>

    <!-- WALLET TAB -->
    <div id="tab-wallet" class="hidden">
      <div class="card">
        <h2>Deposit Money</h2>
        <input type="number" id="dep-amt" placeholder="Amount (Min 10)" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="dep-tx" placeholder="Telebirr Tx ID" style="width:100%; padding:10px; margin-bottom:10px;">
        <button class="btn" onclick="submitDeposit()">Submit Deposit</button>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="switchTab('play')">🎮 Play</button>
    <button onclick="switchTab('wallet')">💰 Wallet</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
    const headers = { 'Authorization': `Bearer ${tg.initData}`, 'Content-Type': 'application/json' };
    
    let currentRoom = null;
    let pollInterval = null;

    // 1. Wallet Fetch (Strict Error Handling)
    async function fetchMe() {
      document.getElementById('w-loading').classList.remove('hidden');
      document.getElementById('w-error').classList.add('hidden');
      document.getElementById('w-balance').classList.add('hidden');
      try {
        const res = await fetch('/api/me', { headers });
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('bal-amt').innerText = data.balance;
        document.getElementById('w-loading').classList.add('hidden');
        document.getElementById('w-balance').classList.remove('hidden');
      } catch (e) {
        document.getElementById('w-loading').classList.add('hidden');
        document.getElementById('w-error').classList.remove('hidden');
      }
    }

    // 2. Load Rooms
    async function loadRooms() {
      const res = await fetch('/api/rooms', { headers });
      const rooms = await res.json();
      let html = '';
      rooms.forEach(r => {
        html += `<div class="card" onclick="joinRoom(${r.id}, '${r.room_number}')">
          <h3>Room #${r.room_number}</h3><p>Pot: ${r.prize_pool} BIRR | Status: ${r.status}</p>
        </div>`;
      });
      document.getElementById('room-list').innerHTML = html || '<p>No active rooms.</p>';
    }

    // 3. Room & Cartela Logic
    async function joinRoom(id, num) {
      currentRoom = id;
      document.getElementById('room-list').classList.add('hidden');
      document.getElementById('room-detail').classList.remove('hidden');
      document.getElementById('r-title').innerText = `Room #${num}`;
      pollRoomState();
      pollInterval = setInterval(pollRoomState, 2000); // Poll every 2s
    }

    function backToRooms() {
      clearInterval(pollInterval); currentRoom = null;
      document.getElementById('room-list').classList.remove('hidden');
      document.getElementById('room-detail').classList.add('hidden');
      loadRooms(); fetchMe(); // Refresh wallet
    }

    async function pollRoomState() {
      if(!currentRoom) return;
      const res = await fetch(`/api/rooms/${currentRoom}/state`, { headers });
      const data = await res.json();
      
      document.getElementById('r-pot').innerText = data.room.prize_pool;
      document.getElementById('r-status').innerText = data.room.status;

      if(data.room.status === 'WAITING') {
        document.getElementById('cartela-ui').classList.remove('hidden');
        document.getElementById('game-ui').classList.add('hidden');
        renderCartelas(data.cartelas, data.myId);
      } else if (data.room.status === 'PLAYING') {
        document.getElementById('cartela-ui').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        renderGame(data);
      }
    }

    function renderCartelas(cartelas, myId) {
      let html = '';
      for(let i=1; i<=100; i++) {
        const c = cartelas.find(x => x.cartela_number === i);
        let cls = 'cartela';
        if(c) cls += c.user_id === myId ? ' mine' : ' taken';
        html += `<div class="${cls}" onclick="toggleCartela(${i})">${i}</div>`;
      }
      document.getElementById('c-grid').innerHTML = html;
    }

    async function toggleCartela(num) {
      try {
        const res = await fetch(`/api/rooms/${currentRoom}/cartela`, { method: 'POST', headers, body: JSON.stringify({number: num}) });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error);
        tg.HapticFeedback.impactOccurred('light');
        pollRoomState(); fetchMe(); // Instantly update UI and Wallet
      } catch (e) { alert(e.message); }
    }

    // 4. Game Engine Render
    function renderGame(data) {
      const g = data.game;
      if(g.current) document.getElementById('g-current-num').innerText = `🎱 ${g.current}`;
      document.getElementById('g-recent').innerText = g.called.slice(-5).join(' - ');
      
      const myCartelas = data.cartelas.filter(c => c.user_id === data.myId);
      let boardHtml = '';
      myCartelas.forEach(c => {
        boardHtml += `<h4>Cartela #${c.cartela_number}</h4><div class="bingo-board">`;
        // Deterministic Pseudo-Random Board Generator based on Cartela Number
        let seed = c.cartela_number * 1234;
        const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        
        for(let col=0; col<5; col++) {
          let pool = Array.from({length:15}, (_,i) => i + 1 + (col*15));
          for(let row=0; row<5; row++) {
            if(col===2 && row===2) { boardHtml += `<div class="cell free">FREE</div>`; continue; }
            let idx = Math.floor(random() * pool.length);
            let n = pool.splice(idx, 1)[0];
            let isCalled = g.called.includes(n) ? 'called' : '';
            boardHtml += `<div class="cell ${isCalled}">${n}</div>`;
          }
        }
        boardHtml += `</div>`;
      });
      document.getElementById('bingo-boards').innerHTML = boardHtml;
    }

    // 5. Utility
    async function submitDeposit() {
      const amt = document.getElementById('dep-amt').value;
      const tx = document.getElementById('dep-tx').value;
      const res = await fetch('/api/deposits', { method: 'POST', headers, body: JSON.stringify({amount:amt, tx:tx}) });
      if(res.ok) { alert('Deposit submitted for review!'); document.getElementById('dep-tx').value=''; }
      else alert('Error submitting deposit.');
    }

    function switchTab(tab) {
      document.getElementById('tab-play').classList.add('hidden');
      document.getElementById('tab-wallet').classList.add('hidden');
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    fetchMe(); loadRooms();
  </script>
</body>
</html>
